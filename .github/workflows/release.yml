name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  require-qa:
    name: Require QA
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.names.outputs.owner }}
      repo: ${{ steps.names.outputs.repo }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release must be run from the main branch."
          exit 1

      - name: Resolve image names
        id: names
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "repo=${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Generate version
        id: version
        shell: bash
        run: |
          printf -v run_number "%04d" "$GITHUB_RUN_NUMBER"
          echo "version=$(TZ=Europe/Stockholm date +'%Y.%m.%d').${run_number}" >> "$GITHUB_OUTPUT"

      - name: Require successful QA for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const workflowName = 'QA';
            const {owner, repo} = context.repo;
            const branch = 'main';
            const headSha = context.sha;

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo }
            );

            const qaWorkflow = workflows.find(workflow => workflow.name === workflowName);
            if (!qaWorkflow) {
              core.setFailed(`Could not find the ${workflowName} workflow.`);
              return;
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: qaWorkflow.id,
                branch,
                status: 'completed',
                per_page: 100
              }
            );

            const passed = runs.some(run => run.head_sha === headSha && run.conclusion === 'success');
            if (!passed) {
              core.setFailed(`QA has not passed for ${headSha} on ${branch}. Push this commit to main and wait for QA to pass before running Release.`);
            }

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs:
      - require-qa

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy
            dockerfile: src/Vakthund.Proxy/Dockerfile
            image: vakthund-proxy
          - name: ui
            dockerfile: src/Vakthund.UI/Dockerfile
            image: vakthund-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.require-qa.outputs.owner }}/${{ matrix.image }}:${{ needs.require-qa.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.require-qa.outputs.owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.require-qa.outputs.version }}
