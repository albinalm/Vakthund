name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  require-qa:
    name: Require QA
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.names.outputs.owner }}
      repo: ${{ steps.names.outputs.repo }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release must be run from the main branch."
          exit 1

      - name: Resolve image names
        id: names
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "repo=${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Generate version
        id: version
        shell: bash
        run: |
          printf -v run_number "%04d" "$GITHUB_RUN_NUMBER"
          echo "version=$(TZ=Europe/Stockholm date +'%Y.%m.%d').${run_number}" >> "$GITHUB_OUTPUT"

      - name: Require successful QA for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const workflowName = 'QA';
            const {owner, repo} = context.repo;
            const branch = 'main';
            const headSha = context.sha;

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo }
            );

            const qaWorkflow = workflows.find(workflow => workflow.name === workflowName);
            if (!qaWorkflow) {
              core.setFailed(`Could not find the ${workflowName} workflow.`);
              return;
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: qaWorkflow.id,
                branch,
                status: 'completed',
                per_page: 100
              }
            );

            const passedQaShas = new Set(
              runs
                .filter(run => run.conclusion === 'success')
                .map(run => run.head_sha)
            );

            let qaSha = headSha;
            const readmeOnlyCommits = [];
            for (let depth = 0; depth < 20; depth++) {
              if (passedQaShas.has(qaSha)) {
                if (qaSha !== headSha) {
                  core.info(`Using QA from ${qaSha}; skipped README-only commit(s): ${readmeOnlyCommits.join(', ')}`);
                }
                return;
              }

              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: qaSha
              });
              const files = commit.data.files ?? [];
              const parents = commit.data.parents ?? [];
              const readmeOnly = files.length > 0 && files.every(file => file.filename === 'README.md');
              if (!readmeOnly || parents.length !== 1) {
                break;
              }

              readmeOnlyCommits.push(qaSha);
              qaSha = parents[0].sha;
            }

            core.setFailed(`QA has not passed for ${headSha} on ${branch}. Push this commit to main and wait for QA to pass before running Release.`);

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs:
      - require-qa

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy
            dockerfile: src/Vakthund.Proxy/Dockerfile
            image: vakthund-proxy
          - name: ui
            dockerfile: src/Vakthund.UI/Dockerfile
            image: vakthund-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.require-qa.outputs.owner }}/${{ matrix.image }}:${{ needs.require-qa.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.require-qa.outputs.owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.require-qa.outputs.version }}

  update-readme:
    name: Update release badge
    runs-on: ubuntu-latest
    needs:
      - require-qa
      - publish
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Sync latest main
        shell: bash
        run: git pull --ff-only origin main

      - name: Update README release badge
        env:
          VERSION: ${{ needs.require-qa.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          replacement = (
              "  <!-- release-badge:start -->\n"
              f'  <a href="https://github.com/{repository}/pkgs/container/vakthund-ui?tag={version}">'
              f'<img src="https://img.shields.io/badge/release-{version}-fd9c1d" alt="Release {version}"></a>\n'
              "  <!-- release-badge:end -->"
          )

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"  <!-- release-badge:start -->.*?  <!-- release-badge:end -->", re.DOTALL)
          updated, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit("Could not find release badge marker in README.md")

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit README release badge
        env:
          VERSION: ${{ needs.require-qa.outputs.version }}
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README release badge already points to ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update release badge to ${VERSION} [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
