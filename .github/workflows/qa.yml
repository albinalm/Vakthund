name: QA

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Vakthund.UI/package-lock.json

      - name: Restore UI packages
        working-directory: src/Vakthund.UI
        run: npm ci

      - name: Build UI CSS
        working-directory: src/Vakthund.UI
        run: npm run css:build

      - name: Restore .NET packages
        run: dotnet restore src/Vakthund.sln

      - name: Build solution
        run: dotnet build src/Vakthund.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test src/Vakthund.sln --configuration Release --no-build --verbosity normal
