name: QA

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Vakthund.UI/package-lock.json

      - name: Restore UI packages
        working-directory: src/Vakthund.UI
        run: npm ci

      - name: Build UI CSS
        working-directory: src/Vakthund.UI
        run: npm run css:build

      - name: Restore .NET packages
        run: dotnet restore src/Vakthund.sln

      - name: Build solution
        run: dotnet build src/Vakthund.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test src/Vakthund.sln --configuration Release --no-build --verbosity normal

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run smoke test
        working-directory: src/Vakthund.Tests/k6
        env:
          K6_VUS: 2
          K6_DURATION: 10s
        run: |
          mkdir -p results
          docker compose --profile load up --build --abort-on-container-exit --exit-code-from k6

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: src/Vakthund.Tests/k6/results/summary.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: src/Vakthund.Tests/k6
        run: docker compose --profile load down --volumes
