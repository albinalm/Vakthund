auths:
  - name: local-api
    enforced: false
    issuer:
    audience:
    audiences: []
    scopes: []
    roles: []
    jwksUrl:
    openIdConfigurationUrl:
    jwe:
      keyType:
      key:
ipPolicies:
  - name: office
    entries:
      - 203.0.113.*
      - 10.0.0.0/8
routes:
  - path: /foobar/**
    target: http://localhost:5001
    to: /api/foobar
    hosts:
      - api.localhost
      - "*.api.localhost"
    auth: local-api
  - path: /api/**
    target: http://localhost:5000
    timeout: 1h
    ips: office
    auth: local-api
  - path: /**
    target: http://localhost:3000
